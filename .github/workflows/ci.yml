name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # A hung step used to hold the job for hours.
    timeout-minutes: 20
    strategy:
      # Both versions run to the end: one failing must not hide the other's.
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test
        run: npm run smoke
        timeout-minutes: 8

  # The built-in engine end to end: the pinned llama.cpp for linux-x64 from
  # GitHub, a 1 MB test model from Hugging Face (TWOODY_MODEL_CATALOG), one
  # question, and the runtime stopped with the server
  # (scripts/smoke-builtin.mjs, docs/builtin-runtime-design.md §6).
  builtin-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Built-in engine smoke test
        run: npm run smoke:builtin
        timeout-minutes: 10
