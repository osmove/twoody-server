name: Docker image

# Builds ghcr.io/osmove/twoody-server for linux/amd64 and linux/arm64
# (Raspberry Pi 5) and pushes it. Runs only when asked: by hand from the
# Actions tab (workflow_dispatch), or when a v* tag is pushed. Nothing runs
# on an ordinary push to main.
on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push the image to ghcr.io (untick to only build)"
        type: boolean
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE: ghcr.io/osmove/twoody-server
    steps:
      - uses: actions/checkout@v4

      # arm64 is built under emulation on the amd64 runner. Nothing is
      # compiled (see the Dockerfile), so it stays a few minutes.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # v0.2.0 → 0.2.0, 0.2 and latest; a manual run on a branch → the
          # branch name and sha-<short>.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha

      # The image must answer /health before anything is pushed.
      - name: Build amd64 for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: twoody-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name twoody -p 3000:3000 twoody-server:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health; then
              docker rm -f twoody >/dev/null
              exit 0
            fi
            sleep 2
          done
          docker logs twoody
          exit 1

      - name: Log in to ghcr.io
        if: github.event_name == 'push' || inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build both architectures (and push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

