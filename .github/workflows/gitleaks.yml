name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The gitleaks GitHub Action needs a paid licence on an organisation's
      # repositories (osmove), so it stopped at "missing gitleaks license"
      # without scanning anything. The command-line tool has no such
      # requirement: downloaded, checked against the release's checksums,
      # run over the whole history with the values redacted.
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl -sSfLO "${base}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/gitleaks_${VERSION}_checksums.txt"
          grep " gitleaks_${VERSION}_linux_x64.tar.gz\$" "gitleaks_${VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${VERSION}_linux_x64.tar.gz" gitleaks

      - name: Scan the history
        run: ./gitleaks git --redact --no-banner --verbose .
